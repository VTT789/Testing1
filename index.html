        .pagination-btn {

        .gear-spin {
            display: inline-block;
            animation: spinRoll 2s linear infinite;
            transform-origin: center center
        }
        @keyframes spinRoll {
            from {
                transform: rotate(0)
            }
            to {
                transform: rotate(360deg)
            }
        }
        .gear-spin:hover {
            animation: spinRoll .8s linear infinite;
            cursor: pointer
        }
        .main-layout {
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: relative
        }
        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #fff;
            min-width: 300px;
            overflow: hidden;
            cursor: pointer;
            transition: background .2s;
            position: relative;
            touch-action: pan-y pinch-zoom
        }
        #floatingMenu {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 9999;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .15);
            width: var(--panel-width);
            cursor: default;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background .2s, border-color .2s;
            touch-action: none
        }
        #panelContent {
            padding: 12px;
            overflow-y: auto;
            flex: 1;
            min-height: 0;
            scrollbar-width: thin;
            -webkit-overflow-scrolling: touch
        }
        .control-group {
            display: none;
            padding: 5px
        }
        .control-group.active {
            display: block
        }
        .drag-handle {
            height: 34px;
            background: #1e293b;
            border-radius: 11px 11px 0 0;
            cursor: move;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            color: #f8fafc;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: .5px;
            gap: 8px;
            white-space: nowrap;
            flex-shrink: 0;
            touch-action: none
        }
        .drag-title-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            overflow: hidden
        }
        .drag-title-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 12px;
            font-weight: 600
        }
        .drag-title-text .badge {
            background: rgba(255, 255, 255, .2);
            padding: 2px 6px;
            border-radius: 20px;
            font-size: 10px
        }
        .aba-icon-inline {
            width: 24px;
            height: 24px;
            cursor: pointer;
            border-radius: 8px;
            transition: transform .1s ease, opacity .2s;
            flex-shrink: 0;
            background: rgba(255, 255, 255, .15);
            padding: 2px;
            box-sizing: border-box;
            pointer-events: auto;
            -webkit-tap-highlight-color: transparent
        }
        .aba-icon-inline:active {
            transform: scale(.95)
        }
        .drag-dark-toggle {
            background: 0 0;
            border: none;
            color: inherit;
            font-size: 18px;
            cursor: pointer;
            flex-shrink: 0;
            pointer-events: auto;
            -webkit-tap-highlight-color: transparent
        }
        .drag-dark-toggle:active {
            transform: scale(.95)
        }
        #minimizedTrigger {
            display: none;
            position: fixed;
            z-index: 10000;
            width: 45px;
            height: 45px;
            background: var(--accent);
            color: #fff;
            border-radius: 50%;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(0, 0, 0, .3);
            font-size: 28px;
            touch-action: none;
            user-select: none;
            bottom: 20px;
            right: 20px;
            left: auto;
            top: auto
        }
        #minimizedTrigger .gear-icon {
            display: inline-block;
            animation: spinRoll 2s linear infinite;
            transform-origin: center center
        }
        #minimizedTrigger:hover .gear-icon {
            animation: spinRoll .6s linear infinite
        }
        .tab-row {
            display: flex;
            background: #f1f5f9;
            margin-bottom: 8px;
            border-radius: 6px;
            padding: 2px;
            flex-shrink: 0;
            transition: background .2s
        }
        .tab-btn {
            flex: 1;
            border: none;
            padding: 6px;
            font-size: .7rem;
            font-weight: 700;
            cursor: pointer;
            border-radius: 4px;
            background: 0 0;
            transition: all .2s
        }
        .nav-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px
        }
        .style-grid {
            display: grid;
            grid-template-columns: 25px 1fr 40px 35px 40px;
            gap: 6px;
            align-items: center;
            margin-bottom: 6px
        }
        .side-style-grid {
            display: grid;
            grid-template-columns: 35px 1fr 40px;
            gap: 6px;
            align-items: center;
            margin-bottom: 6px
        }
        .pinyin-style-grid {
            display: grid;
            grid-template-columns: 35px 1fr 40px 40px;
            gap: 6px;
            align-items: center;
            margin-bottom: 6px
        }
        .shadow-style-grid {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid var(--border);
            flex-wrap: nowrap
        }
        .shadow-style-grid label {
            font-size: .65rem;
            font-weight: 700;
            width: 110px;
            flex-shrink: 0;
            color: var(--text-secondary)
        }
        .shadow-style-grid .size-slider {
            flex: 1
        }
        .shadow-style-grid span {
            flex-shrink: 0;
            font-size: .7rem;
            min-width: 32px;
            text-align: right
        }
        .voice-row {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 10px;
            background: #f8fafc;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid var(--border);
            transition: all .2s
        }
        .size-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            padding: 0 5px
        }
        .size-row label {
            font-size: .65rem;
            font-weight: 700;
            width: 110px;
            color: var(--text-secondary)
        }
        .size-slider {
            flex: 1;
            height: 4px;
            cursor: pointer;
            -webkit-appearance: none;
            background: var(--slider-track);
            border-radius: 2px
        }
        .size-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer
        }
        .custom-font-input,
        .font-select,
        .voice-select {
            padding: 4px;
            border-radius: 4px;
            border: 1px solid #cbd5e1;
            font-size: .75rem;
            width: 100%;
            transition: all .2s
        }
        .color-input {
            width: 100%;
            height: 24px;
            border: none;
            cursor: pointer;
            background: 0 0;
            padding: 0
        }
        .bold-icon-btn {
            cursor: pointer;
            font-weight: 700;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            text-align: center;
            font-size: 1rem;
            padding: 4px 0;
            transition: all .2s;
            background: #f8fafc;
            color: #334155;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px
        }
        .bold-icon-btn:hover {
            background: #e2e8f0;
            transform: scale(.98)
        }
        .bold-icon-btn.active {
            background: #1e293b;
            color: #fff;
            border-color: #1e293b
        }
        .bold-icon-btn.active::before {
            content: "⬤";
            font-size: .7rem;
            font-weight: 400;
            margin-right: 4px
        }
        .bold-icon-btn.active span {
            font-weight: 700;
            letter-spacing: .5px
        }
        .bold-icon-btn:not(.active)::before {
            content: "○";
            font-size: .7rem;
            font-weight: 400;
            margin-right: 4px;
            opacity: .6
        }
        .bold-icon-btn:not(.active) span {
            font-weight: 400;
            opacity: .7
        }
        .offset-reset-btn {
            background: #ef4444;
            color: #fff;
            border: none;
            border-radius: 20px;
            padding: 4px 12px;
            cursor: pointer;
            font-size: .75rem;
            font-weight: 700;
            transition: all .2s;
            margin-left: 8px
        }
        .offset-reset-btn:hover {
            background: #dc2626;
            transform: scale(.96)
        }
        .display-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            pointer-events: auto;
            background: inherit;
            gap: 2rem;
            overflow: visible;
            touch-action: pan-y pinch-zoom
        }
        .chinese-word {
            position: absolute;
            display: flex;
            flex-wrap: nowrap;
            justify-content: center;
            align-items: center;
            gap: 8px 12px;
            cursor: grab;
            padding: 12px 20px;
            transition: none;
            z-index: 10;
            background: 0 0;
            backdrop-filter: none;
            border: none;
            box-shadow: none;
            will-change: left, top;
            white-space: nowrap;
            touch-action: pan-y pinch-zoom;
            max-width: 90vw;
            overflow-x: visible;
            overflow-y: visible
        }
        .chinese-word:active {
            cursor: grabbing
        }
        .char-block {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            white-space: nowrap;
            position: relative;
        }

            position: relative;
            transition: none;

        }

            white-space: nowrap;

            text-shadow: 0 0 0 transparent;
            transition: text-shadow .1s ease;

        }
        .chinese-bottom {
            font-weight: 500;
            letter-spacing: .3px;
            line-height: 1;
            white-space: nowrap;
            margin-top: 0;

            color: #fff;

        }
        body.night-mode .chinese-bottom {
            color: #60a5fa
        }
        .khmer-text {

            font-weight: 500;
            color: #fff;

            font-family: KHLazySmooth, 'Segoe UI', system-ui;
            transition: none;
            z-index: 10;
            background: 0 0;
            backdrop-filter: none;
            border: none;
            box-shadow: none;
            text-shadow: 0 0 0 transparent;
            will-change: left, top;
            touch-action: pan-y pinch-zoom;
            max-width: 90vw;
            overflow-x: visible;
            overflow-y: visible
        }
        .khmer-text:active {
            cursor: grabbing
        }
        .emoji-container {
            position: fixed;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            background: rgba(0, 0, 0, .5);
            backdrop-filter: blur(12px);
            border-radius: 60px;
            padding: 8px 20px;
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: center;
            font-size: var(--emoji-font-size, 32px);
            pointer-events: auto;
            transition: none;
            border: 1px solid rgba(255, 255, 255, .3);
            white-space: nowrap;
            cursor: grab;
            font-weight: 500;
            letter-spacing: 2px;
            touch-action: none
        }
        .emoji-container:active {
            cursor: grabbing
        }
        .emoji-container.visible {
            display: flex
        }
        .emoji-container.hidden {
            display: none
        }
        .emoji-container:hover {

    <script>
      // ======================== SAFE LOCALSTORAGE WRAPPER =========================
let storageQuotaExceeded = false;
let _quotaToastShown = false;
let _lastQuotaCheck = 0;
let _quotaErrorCount = 0;

function safeSetItem(key, value) {
    // If quota is already exceeded, skip localStorage entirely
    if (storageQuotaExceeded) {
        // Only try IndexedDB for critical data (vocab list)
        if (key === 'vocabMaster_List_Compressed' || key === 'vocabMaster_List_StoredInIndexedDB') {
            // Let the caller handle IndexedDB fallback
            return false;
        }
        // For all other keys, just return false without showing toast
        return false;
    }
    
    try {
        localStorage.setItem(key, value);
        // If we successfully wrote, reset the quota state
        storageQuotaExceeded = false;
        _quotaToastShown = false;
        _quotaErrorCount = 0;
        const warn = document.getElementById('cacheWarning');
        if (warn) warn.style.display = 'none';
        return true;
    } catch (e) {
        // Check if this is a quota error
        if (e.name === 'QuotaExceededError' || e.code === 22 || 
            e.name === 'NS_ERROR_DOM_QUOTA_REACHED' || 
            (e.name === 'SecurityError' && e.message && e.message.includes('quota'))) {
            
            storageQuotaExceeded = true;
            _quotaErrorCount++;
            console.warn('localStorage quota exceeded for key:', key);
            
            // Show the warning in the UI
            const warn = document.getElementById('cacheWarning');
            if (warn) warn.style.display = 'block';
            
            // Only show toast once every 10 seconds to avoid spam
            const now = Date.now();
            if (!_quotaToastShown || (now - _lastQuotaCheck) > 10000) {
                _quotaToastShown = true;
                _lastQuotaCheck = now;
                showToast('⚠️ Storage full! Tap "Clear Cache" in Load Vocabulary modal.');
            }
            return false;
        }
        console.warn('localStorage error:', e);
        return false;
    }
}

function safeGetItem(key, fallback) {
    // If quota is exceeded, still try to read (reads don't throw quota errors)
    try {
        const val = localStorage.getItem(key);
        return val !== null ? val : fallback;
    } catch (e) {
        return fallback;
    }
}

function safeRemoveItem(key) {
    try { localStorage.removeItem(key); } catch (e) {}
}

// Function to reset quota state (call this after clearing cache)
function resetQuotaState() {
    storageQuotaExceeded = false;
    _quotaToastShown = false;
    _lastQuotaCheck = 0;
    _quotaErrorCount = 0;
    const warn = document.getElementById('cacheWarning');
    if (warn) warn.style.display = 'none';
}

function safeRemoveItem(key) {
    try { localStorage.removeItem(key); } catch (e) {}
}

        function compressVocabList(list) {
    return list.map(item => [
        item.khmer || '',
        item.chinese || '',
        item.sheetRow || 2,
        // Store '' instead of 'Uncategorized' to save space
        (item.group === 'Uncategorized' ? '' : (item.group || ''))
    ]);

        async function speakAutoSequence(chinese, khmer) {
            // Guard: if no text, just return
            if (!chinese && !khmer) return;

            // Cancel any previous speech
            if (_speechCancelToken) {
                _speechCancelToken.cancelled = true;
            }
            // Create a new token for this speech
            const token = { cancelled: false };
            _speechCancelToken = token;

            // Kill current audio without cancelling our new token
            _killAudioOnly();
            await new Promise(resolve => setTimeout(resolve, 30));
            if (token.cancelled) return;

            // If auto is active, clear any pending timer
            if (autoTimer) {
                clearTimeout(autoTimer);
                autoTimer = null;

            const zhReps = parseInt(document.getElementById('zhReps').value) || 1;

            const zhVoice = document.getElementById('zhVoiceSelect').value;

            const rateSlider = document.getElementById('zhRateSlider');
            let rate = rateSlider ? parseInt(rateSlider.value) : 0;
            let rateStr = rate === 0 ? '0%' : (rate > 0 ? '+' + rate + '%' : rate + '%');
            const order = getSpeechOrder();

            const speakZh = async () => {
                if (zhReps > 0 && chinese && chinese.trim()) {
                    for (let i = 0; i < zhReps; i++) {
                        if (token.cancelled) break;
                        try {

                        } catch (e) {
                            if (!token.cancelled) console.warn('TTS error:', e);
                        }
                        if (token.cancelled) break;
                        await new Promise(resolve => setTimeout(resolve, 50));
                    }
                }
            };

            const speakKm = async () => {
                if (kmReps > 0 && khmer && khmer.trim()) {
                    for (let i = 0; i < kmReps; i++) {
                        if (token.cancelled) break;
                        try {

                            if (!token.cancelled) console.warn('TTS error:', e);
                        }
                        if (token.cancelled) break;
                        await new Promise(resolve => setTimeout(resolve, 50));
                    }
                }
            };

            try {
                if (order === 'zh_first') {
                    await speakZh();
                    if (token.cancelled) return;
                    await speakKm();
                } else {
                    await speakKm();
                    if (token.cancelled) return;
                    await speakZh();
                }

        // ===== IMPROVED: compute relevance score for search matches =====
        function getRelevanceScore(item, query) {
            const chineseLower = (item.chinese || '').toLowerCase();
            const khmerLower = (item.khmer || '').toLowerCase();
            const q = query.toLowerCase();
            let score = 0;

            const chineseExact = chineseLower === q;
            const khmerExact = khmerLower === q;
            const chineseStartsWith = chineseLower.startsWith(q);
            const khmerStartsWith = khmerLower.startsWith(q);
            const chineseContains = chineseLower.includes(q);
            const khmerContains = khmerLower.includes(q);

            if (!chineseContains && !khmerContains) return 0;

            // Exact match (highest priority)
            if (chineseExact) score += 10000;
            if (khmerExact) score += 9000;

            // Starts with (high priority)
            if (chineseStartsWith && !chineseExact) score += 1000;
            if (khmerStartsWith && !khmerExact) score += 900;

            // Contains (medium priority) — only if not already counted as starts-with or exact
            if (chineseContains && !chineseStartsWith && !chineseExact) score += 500;
            if (khmerContains && !khmerStartsWith && !khmerExact) score += 400;

            // Bonus for shorter length (more precise match)
            if (chineseContains) score += Math.max(0, 50 - item.chinese.length);
            if (khmerContains) score += Math.max(0, 50 - item.khmer.length);

            // Slight bonus for Chinese match over Khmer match (primary language)
            if (chineseContains) score += 10;

            return score;
        }

        // Perform search with limit and optimized loop, respecting pendingDeletions + SORTED
        // Shows ↪️ for recycle bin items, 🗑️ for active items
        function performSearch(query, container, isEdit = false) {
            const q = query.trim().toLowerCase();
            if (!q) { container.innerHTML = ""; return; }
            const matches = [];
            const limit = 30;
            for (let i = 0; i < vocabList.length; i++) {
                if (pendingDeletions.has(i)) continue;
                const v = vocabList[i];
                const score = getRelevanceScore(v, q);
                if (score > 0) {
                    matches.push({ index: i, item: v, score: score });
                }
            }
            // Sort by score descending (best match first)
            matches.sort((a, b) => b.score - a.score);
            const limited = matches.slice(0, limit);

            if (limited.length === 0) {
                container.innerHTML = '<div style="padding:8px; text-align:center; color:#aaa;">No matches</div>';
                return;
            }
            let html = '';
            for (const match of limited) {
                const idx = match.index;
                const v = match.item;
                const row = v.sheetRow;
                const khmerEsc = escapeHtml(v.khmer);
                const chineseEsc = escapeHtml(v.chinese);
                const chineseJs = jsEscape(chineseEsc);
                const khmerJs = jsEscape(khmerEsc);
                const isDeleted = softDeletedIndices.has(idx);
                // Show ↩️ for recycle bin items, 🗑️ for active items
                const actionIcon = isDeleted ? '↩️' : '🗑️';
                const actionFn = isDeleted ?
                    `window.restoreFromSearch(${idx}, '${jsEscape(q)}', ${isEdit})` :
                    (isEdit ?
                        `window.deleteFromEditSearch(${idx}, ${row}, '${jsEscape(q)}')` :
                        `window.deleteFromAddSearch(${idx}, ${row}, '${jsEscape(q)}')`);
                const onclickLoad = `loadWordByMode(${idx}, true); ${isEdit ? `window.updateEditModalState(${idx}, ${row}, '${chineseJs}', '${khmerJs}');` : `requestEditModal(${idx}, ${row}, '${khmerJs}', '${chineseJs}');`}`;
                const delBadge = isDeleted ? ' <span style="font-size:0.7rem;opacity:0.6;">(recycle bin)</span>' : '';
                html += `<div style="padding:8px; border-bottom:1px solid #ccc; cursor:pointer; background:rgba(255,255,255,0.1); margin:2px 0; border-radius:8px; color:#fff; display:flex; justify-content:space-between; align-items:center; ${isDeleted ? 'opacity:0.7;' : ''}" 
                                onclick="${onclickLoad}"
                                data-idx="${idx}"
                                data-row="${row}"
                                data-chinese="${chineseJs}"
                                data-khmer="${khmerJs}"
                                >
                                <span style="flex:1; font-family:Inter, system-ui, -apple-system, sans-serif !important; font-size:1.1rem;"><strong style="font-size:1.15rem;">${chineseEsc}</strong> — ${khmerEsc}${delBadge}</span>
                                <span class="search-delete-btn" style="cursor:pointer; padding:4px 14px; font-size:1.3rem; border-radius:20px; background:${isDeleted ? 'rgba(34,197,94,0.2)' : 'rgba(255,0,0,0.2)'};" 
                                      onclick="event.stopPropagation(); ${actionFn}" 
                                      ontouchstart="event.preventDefault(); event.stopPropagation(); ${actionFn}">${actionIcon}</span>
                            </div>`;
            }
            container.innerHTML = html;
        }

            const item = vocabList[idx];

            // Backup data

            }

        function findNextAvailableIndex(fromIdx) {
            // Search forward first, then backward
            for (let i = fromIdx + 1; i < vocabList.length; i++) {
                if (!softDeletedIndices.has(i)) return i;
            }
            for (let i = fromIdx - 1; i >= 0; i--) {
                if (!softDeletedIndices.has(i)) return i;
            }
            return -1;
        }

        async function permanentlyDeleteSoftDeleted(idx) {
    if (!softDeletedIndices.has(idx)) {
        showToast("⚠️ Not in recycle bin");
        return false;
    }
    const item = vocabList[idx];
    if (!item) return false;
    const rowToDelete = item.sheetRow;

    try {
        // Step 1: Delete from Google Sheet
        await deleteVocabByRow(rowToDelete);

        // Step 2: Remove from vocabList
        vocabList.splice(idx, 1);
        
        // Step 3: Remove from soft-deleted collections
        softDeletedIndices.delete(idx);
        softDeletedData.delete(idx);

        // Step 4: Update sheetRow for remaining items
        for (let i = 0; i < vocabList.length; i++) {
            if (vocabList[i].sheetRow > rowToDelete) {
                vocabList[i].sheetRow--;
            }
        }

        // Step 5: Update softDeletedData keys
        const newSoftData = new Map();
        for (let [k, v] of softDeletedData) {
            if (v.sheetRow > rowToDelete) {
                v.sheetRow--;
            }
            const newKey = k > idx ? k - 1 : k;
            newSoftData.set(newKey, v);
        }
        softDeletedData.clear();
        for (let [k, v] of newSoftData) {
            softDeletedData.set(k, v);
        }

        // Step 6: Update softDeletedIndices
        const newSoftIndices = new Set();
        for (let k of softDeletedIndices) {
            const newKey = k > idx ? k - 1 : k;
            newSoftIndices.add(newKey);
        }
        softDeletedIndices.clear();
        for (let k of newSoftIndices) {
            softDeletedIndices.add(k);
        }

        pendingDeletions.delete(idx);
        return true;
    } catch (err) {
        console.warn("Delete failed for row", rowToDelete, err);
        showToast(`❌ Delete failed: ${err.message || 'Network error'}`);
        return false;
    }
}

// ===== FUNCTION TO EDIT GROUP NAME (updates all items in that group) =====
async function editGroupName(oldGroupName, newGroupName) {
    if (!editUnlocked) {
        return new Promise((resolve, reject) => {
            showPasswordModal(async (n) => {
                if (n) {
                    try { const res = await editGroupName(oldGroupName, newGroupName);
                        resolve(res); } catch (err) { reject(err); }
                } else reject(new Error('Password required'));
            });
        });
    }
    
    if (!oldGroupName || !newGroupName || oldGroupName === newGroupName) {
        showToast("⚠️ Please enter a new group name");
        return false;
    }
    
    if (oldGroupName === 'Uncategorized') {
        showToast("⚠️ Cannot rename 'Uncategorized' group");
        return false;
    }
    
    // Check if new group name already exists
    if (groupMap.has(newGroupName) && newGroupName !== oldGroupName) {
        if (!confirm(`⚠️ Group "${newGroupName}" already exists. Merge "${oldGroupName}" into "${newGroupName}"?`)) {
            return false;
        }
    }
    
    // Get all indices in the old group
    const indices = groupMap.get(oldGroupName) || [];
    if (indices.length === 0) {
        showToast("⚠️ Group is empty");
        return false;
    }
    
    // Collect all sheet rows to update
    const rowsToUpdate = [];
    for (const idx of indices) {
        const item = vocabList[idx];
        if (item && item.sheetRow) {
            rowsToUpdate.push({
                row: item.sheetRow,
                khmer: item.khmer,
                chinese: item.chinese,
                group: newGroupName
            });
        }
    }
    
    if (rowsToUpdate.length === 0) {
        showToast("No valid rows to update");
        return false;
    }
    
    // ============================================================
    // ===== IMMEDIATE UI UPDATE (like Delete All) =====
    // ============================================================
    
    // Update all vocab items in the group
    for (const idx of indices) {
        if (vocabList[idx]) {
            vocabList[idx].group = newGroupName;
        }
    }
    
    // Rebuild group map
    buildGroupMap();
    
    // Apply filter (if we were filtering on the old group, switch to new group)
    if (groupFilter === oldGroupName) {
        groupFilter = newGroupName;
        safeSetItem('groupFilter', groupFilter);
    }
    
    applyGroupFilter();
    
    // ===== IMMEDIATE UI REFRESH (same as Delete All) =====
    renderSidebarUI();
    updateRecycleBinBadge();
    updateStatusBar();
    
    // Update vocabSearchResults IMMEDIATELY (Add modal)
    const addInput = document.getElementById('addChineseInput');
    if (addInput && window.addModalPerformSearch) {
        setTimeout(() => {
            window.addModalPerformSearch(addInput.value);
        }, 10);
    }
    
    // Update Edit modal search results
    const editInput = document.getElementById('editChineseInput');
    if (editInput && window.editModalPerformSearch) {
        setTimeout(() => {
            window.editModalPerformSearch(editInput.value);
        }, 10);
    }
    
    saveAllData();
    
    // Show success message immediately (like Delete All)
    showToast(`📁 Renamed "${oldGroupName}" → "${newGroupName}" (${indices.length} items)`);
    
    // ============================================================
    // ===== SEND API REQUEST IN BACKGROUND (like Delete All) =====
    // ============================================================
    const originalShowToast = showToast;
    let successCount = 0;
    let failCount = 0;
    
    try {
        // Suppress all toast messages from API (only show errors)
        window.showToast = function(msg) {
            if (msg.includes('failed') || msg.includes('error') || msg.includes('Error')) {
                originalShowToast(msg);
            }
        };
        
        // Update each row with the new group name
        for (const item of rowsToUpdate) {
            try {
                await updateVocabByRow(item.row, item.khmer, item.chinese, newGroupName);
                successCount++;
                console.log(`✅ Updated row ${item.row} to group "${newGroupName}"`);
            } catch (err) {
                failCount++;
                console.error(`❌ Failed to update row ${item.row}:`, err);
            }
        }
        
        window.showToast = originalShowToast;
        
        if (failCount === 0) {
            console.log(`✅ Updated all ${successCount} rows to group "${newGroupName}"`);
        } else {
            console.log(`⚠️ Updated ${successCount} rows, ${failCount} failed`);
            // Only show error if there were failures
            if (failCount > 0 && successCount === 0) {
                showToast(`⚠️ Failed to sync group changes to sheet`);
            }
        }
    } catch (err) {
        window.showToast = originalShowToast;
        if (err.message && !err.message.includes('success')) {
            showToast(`⚠️ Background sync failed: ${err.message}`);
        }
        console.error("Background update error:", err);
    }
    
    return true;
}

        function attachRecycleBinLongPress(button, callback, duration = 500) {
            if (!button) return button;
            let timer = null;
            let pointerMoved = false;
            let touchStartX = 0,
                touchStartY = 0;
            let isLongPress = false;
            let longPressHandled = false;

                    cy = e.clientY;

                        timer = null; }
                }

            const endPress = (e) => {
                if (timer) { clearTimeout(timer);
                    timer = null; }

                if (longPressHandled || isLongPress) {
                    if (e) {
                        e.preventDefault();
                        e.stopPropagation();
                    }
                }

                window.removeEventListener('mousemove', movePress);
                window.removeEventListener('touchmove', movePress);
                window.removeEventListener('mouseup', endPress);
                window.removeEventListener('touchend', endPress);
            };

            const newBtn = button.cloneNode(true);
            button.parentNode.replaceChild(newBtn, button);

            newBtn.addEventListener('pointerdown', function(e) {
                if (e.pointerType === 'mouse' && e.button !== 0) return;
                startPress(e);
            });

            newBtn.addEventListener('pointermove', function(e) {
                movePress(e);
            });

            newBtn.addEventListener('pointerup', function(e) {
                endPress(e);
            });

            newBtn.addEventListener('pointercancel', function(e) {
                if (timer) { clearTimeout(timer);
                    timer = null; }
                isLongPress = false;
                longPressHandled = false;
                button.dataset.longPressTriggered = 'false';
            });

            newBtn.addEventListener('touchstart', startPress, { passive: true });
            newBtn.addEventListener('touchmove', movePress, { passive: true });
            newBtn.addEventListener('touchend', endPress);
            newBtn.addEventListener('touchcancel', function(e) {
                if (timer) { clearTimeout(timer);

                longPressHandled = false;
                button.dataset.longPressTriggered = 'false';
            });

            return newBtn;

        async function getSheetName(sheetId) {
            try {
                const cachedName = safeGetItem('sheetName_' + sheetId, '');
                if (cachedName) {
                    console.log('✅ Using cached sheet name:', cachedName);
                    return cachedName;
                }

                const apiUrl = safeGetItem('vocabMaster_ApiUrl', '');
                if (apiUrl && apiUrl.startsWith('http')) {
                    try {
                        console.log('🔍 Fetching sheet name from API...');
                        const response = await fetch(apiUrl, {
                            method: "POST",
                            headers: { "Content-Type": "text/plain" },
                            body: JSON.stringify({
                                action: "getFileName",
                                sheetId: sheetId,
                                sheetName: "Sheet1"
                            })
                        });
                        if (response.ok) {
                            const data = await response.json();
                            console.log('📥 API Response:', data);
                            if (data.result === "success" && data.fileName) {
                                if (!data.fileName.startsWith('http://') &&
                                    !data.fileName.startsWith('https://') &&
                                    !data.fileName.includes('docs.google.com')) {
                                    safeSetItem('sheetName_' + sheetId, data.fileName);
                                    console.log('✅ Saved sheet name:', data.fileName);
                                    return data.fileName;
                                } else {
                                    console.warn('⚠️ API returned URL instead of filename:', data.fileName);
                                }
                            }
                        }
                    } catch (e) {
                        console.warn('⚠️ API fetch failed:', e);
                    }
                }

                if (currentSheetId === sheetId && vocabList.length > 0) {
                    const sheetName = safeGetItem('sheetName_' + sheetId, '');
                    if (sheetName) {
                        return sheetName;
                    }
                }

                let displayName = sheetId;
                if (sheetId.length > 25) {
                    displayName = sheetId.substring(0, 12) + '...' + sheetId.substring(sheetId.length - 8);
                } else if (sheetId.length > 15) {
                    displayName = sheetId.substring(0, 10) + '...' + sheetId.substring(sheetId.length - 5);
                }
                console.log('📛 Using fallback name:', displayName);
                return displayName;
            } catch (err) {
                console.warn('⚠️ Could not fetch sheet name:', err);
                if (sheetId.length > 25) {
                    return sheetId.substring(0, 12) + '...' + sheetId.substring(sheetId.length - 8);
                }
                return sheetId;
            }
        }

    // Recycle Bin button handler - Updated with silent background delete
const rbBtn = document.getElementById('recycleBinBtn');
if (rbBtn) {
    rbBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        showRecycleBinModal(false);
    });
    
    // Long press on recycle bin button: delete all immediately
    let holdTimer = null;
    let isLongPress = false;
    let longPressHandled = false;
    let pointerMoved = false;
    let pointerDownTime = 0;

    const startHold = function(e) {
        isLongPress = false;
        longPressHandled = false;
        pointerMoved = false;
        pointerDownTime = Date.now();

        if (holdTimer) {
            clearTimeout(holdTimer);
            holdTimer = null;
        }

        holdTimer = setTimeout(async () => {
            if (!pointerMoved) {
                isLongPress = true;
                longPressHandled = true;
                const count = softDeletedIndices.size;
                if (count === 0) {
                    showToast("Recycle bin is empty");
                    return;
                }
                if (!confirm(`⚠️ Permanently delete all ${count} items from sheet? This action cannot be undone!`)) return;

                // Collect all sheet rows to delete
                const rowsToDelete = [];
                const validIndices = [];
                for (const idx of softDeletedIndices) {
                    const item = vocabList[idx];
                    if (item && item.sheetRow) {
                        rowsToDelete.push(item.sheetRow);
                        validIndices.push(idx);
                    }
                }
                
                if (rowsToDelete.length === 0) {
                    showToast("No valid rows to delete");
                    return;
                }
                
                // ===== IMMEDIATE UI UPDATE =====
                const sortedIndices = validIndices.sort((a, b) => b - a);
                for (const idx of sortedIndices) {
                    if (softDeletedIndices.has(idx)) {
                        vocabList.splice(idx, 1);
                        softDeletedIndices.delete(idx);
                        softDeletedData.delete(idx);
                    }
                }
                
                // Update sheetRow values
                for (let i = 0; i < vocabList.length; i++) {
                    let shiftCount = 0;
                    for (const delRow of rowsToDelete) {
                        if (delRow < vocabList[i].sheetRow) shiftCount++;
                    }
                    if (shiftCount > 0) {
                        vocabList[i].sheetRow = vocabList[i].sheetRow - shiftCount;
                    }
                }
                
                // Update softDeletedData
                const newSoftData = new Map();
                for (let [k, v] of softDeletedData) {
                    let shiftCount = 0;
                    for (const delRow of rowsToDelete) {
                        if (delRow < v.sheetRow) shiftCount++;
                    }
                    const newKey = k - validIndices.filter(idx => idx < k).length;
                    v.sheetRow = v.sheetRow - shiftCount;
                    newSoftData.set(newKey, v);
                }
                softDeletedData.clear();
                for (let [k, v] of newSoftData) {
                    softDeletedData.set(k, v);
                }
                
                // Update softDeletedIndices
                const newSoftIndices = new Set();
                for (let k of softDeletedIndices) {
                    const shift = validIndices.filter(idx => idx < k).length;
                    newSoftIndices.add(k - shift);
                }
                softDeletedIndices.clear();
                for (let k of newSoftIndices) {
                    softDeletedIndices.add(k);
                }
                
                // ===== IMMEDIATE UI REFRESH =====
                renderSidebarUI();
                updateRecycleBinBadge();
                
                // Update vocabSearchResults immediately
                const addInput = document.getElementById('addChineseInput');
                if (addInput && window.addModalPerformSearch) {
                    window.addModalPerformSearch(addInput.value);
                }
                const editInput = document.getElementById('editChineseInput');
                if (editInput && window.editModalPerformSearch) {
                    window.editModalPerformSearch(editInput.value);
                }
                
                if (vocabList.length === 0) {
                    updateChineseDisplay("");
                    document.getElementById("khmerWord").innerText = "";
                } else {
                    const nextIdx = findNextAvailableIndex(0);
                    if (nextIdx !== -1) loadWordByMode(nextIdx, true);
                }
                
                saveAllData();
                
                // Show success message ONLY ONCE
                showToast(`✅ Successfully deleted ${validIndices.length} items from sheet`);
                
                // ===== SEND API REQUEST IN BACKGROUND (silent) =====
                try {
                    await deleteMultipleVocab(rowsToDelete);
                    console.log(`✅ Background delete completed for ${rowsToDelete.length} rows`);
                } catch (err) {
                    console.error("Background delete API error:", err);
                }
                
                setTimeout(() => { longPressHandled = false; }, 300);
            }
            holdTimer = null;
        }, 500);
    };

    const endHold = function(e) {
        if (holdTimer) {
            clearTimeout(holdTimer);
            holdTimer = null;
        }
        setTimeout(() => {
            if (isLongPress) {
                isLongPress = false;
            }
        }, 100);
    };

    const handleClick = function(e) {
        if (longPressHandled) {
            e.preventDefault();
            e.stopPropagation();
            return;
        }
        if (isLongPress) {
            e.preventDefault();
            e.stopPropagation();
            return;
        }
        e.stopPropagation();
        showRecycleBinModal(false);
    };

    rbBtn.addEventListener('pointerdown', function(e) {
        startHold(e);
    });
    rbBtn.addEventListener('pointerup', function(e) {
        endHold(e);
    });
    rbBtn.addEventListener('pointercancel', function(e) {
        if (holdTimer) {
            clearTimeout(holdTimer);
            holdTimer = null;
        }
        isLongPress = false;
        longPressHandled = false;
    });
    rbBtn.addEventListener('pointermove', function(e) {
        pointerMoved = true;
    });
    rbBtn.addEventListener('click', handleClick);
}

    if (!sidebarVisible) document.getElementById("sidebarControlsContainer")?.classList.add(
        "sidebar-controls-hidden");

    const topSec = document.getElementById("topPinyinSection");

    document.getElementById("sKmColor").addEventListener("input", applyStyles);
    document.getElementById("mZhFont").addEventListener("change", function() { applyChineseMainStyle();
        saveAllData(); });
    document.getElementById("mKmFont").addEventListener("change", applyStyles);
    document.getElementById("sZhFont").addEventListener("change", applyStyles);

        saveAllData(); });

    document.getElementById("pinyinColor").addEventListener("input", applyPinyinStyles);

        saveAllData(); });

document.addEventListener('visibilitychange', function() {
